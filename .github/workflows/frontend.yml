name: Frontend CI (Flutter)

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'task_management/**'
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'task_management/**'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./task_management

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Analyze code (Linting)
      run: flutter analyze
      
    # - name: Run tests
    #   run: flutter test
